services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: making_flower_development
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # PC の MySQL（3306）と ぶつからない ように 3307 に した。web は Docker の 中で db:3306 に つなぐ ので、ここは PC から DB を のぞく とき だけ 使う
      - "3307:3306"

  web:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: app
    environment:
      # ✂️ 切り抜きの依頼の送り先（Discord のウェブフック）。値は .env に書く（.env はコミットしない）
      DISCORD_CLIP_WEBHOOK_URL: ${DISCORD_CLIP_WEBHOOK_URL:-}
      # 🌱 町の 素材（Sprout Lands）を 開発でも S3 から 読む。本番（Heroku の Config Vars）と 同じ 値を .env に 書く
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b '0.0.0.0'"
    volumes:
      - ".:/app"
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db_data:
